server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 21m;  # PDF uploads are capped at 20 MB by the API

  # Same-origin API: the browser calls /api/*, nginx forwards to the FastAPI container.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA routing lives in the hash, so everything else serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
